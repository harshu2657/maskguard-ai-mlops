services:
  api:
    build: .
    container_name: maskguard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: "http://host.docker.internal:5001"
    volumes:
      - ./mlruns:/mlruns
    restart: unless-stopped

  streamlit:
    build: .
    container_name: maskguard-streamlit
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: "http://api:8000"
    depends_on:
      - api
    restart: unless-stopped